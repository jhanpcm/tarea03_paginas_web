<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cierre de Caja - Bucle While</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Módulo de Caja Diaria</h2>
    <form onsubmit="return false;">
        <label for="tipoCambioInput">Tipo de Cambio (S/ por $):</label><br>
        <input type="number" id="tipoCambioInput" placeholder="Ej. 3.75" step="0.01" value="3.75"><br><br>
        <label for="montoInput">Monto de la Venta (S/):</label><br>
        <input type="number" id="montoInput" placeholder="Ej. 50.50" step="0.01"><br><br>
        <button type="button" onclick="registrarVenta()">Registrar Venta</button>
        <button type="button" onclick="calcularTotalCaja()">Calcular Total Acumulado</button>
    </form>
    <p id="mensajeVenta"></p>
    <h3>Historial de Ventas del Turno:</h3>
    <ul id="historialVentas"></ul>
    <h3 id="totalCajaTexto">Total en Caja: S/ 0.00</h3>
    <h3 id="totalDolaresTexto">Total en Dólares: $ 0.00</h3>
    <script>
        let ventasRegistradas = [];
        function registrarVenta() {
            let monto = parseFloat(document.getElementById("montoInput").value);
            if (isNaN(monto) || monto <= 0) {
                alert("Ingrese un monto válido mayor a 0.");
                return;
            }
            ventasRegistradas.push(monto);
            document.getElementById("montoInput").value = "";
            document.getElementById("mensajeVenta").innerText = "Venta de S/ " + monto.toFixed(2) + " registrada.";
            let lista = document.getElementById("historialVentas");
            let item = document.createElement("li");
            item.innerText = "Venta: S/ " + monto.toFixed(2);
            lista.appendChild(item);
        }
        function calcularTotalCaja() {
            let total = 0;
            let i = 0;
            while (i < ventasRegistradas.length) {
                total += ventasRegistradas[i];
                i++;
            }
            document.getElementById("totalCajaTexto").innerText = "Total acumulado en caja: S/ " + total.toFixed(2);
            let tipoCambio = parseFloat(document.getElementById("tipoCambioInput").value);
            if (!isNaN(tipoCambio) && tipoCambio > 0) {
                let totalDolares = total / tipoCambio;
                document.getElementById("totalDolaresTexto").innerText = "Total equivalente en dólares: $ " + totalDolares.toFixed(2);
            } else {
                document.getElementById("totalDolaresTexto").innerText = "Ingrese un tipo de cambio válido.";
            }
        }
    </script>
</body>
</html>
