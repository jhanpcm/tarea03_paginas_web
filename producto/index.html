<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carga de Productos - Bucle While</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Registro de Productos en Inventario</h2>
    <form id="inventarioForm" onsubmit="return false;">
        <label for="productoInput">Nombre del Producto:</label><br>
        <input type="text" id="productoInput" placeholder="Ej. Teclado USB"><br><br>
        <button type="button" onclick="agregarProducto()">Guardar Producto</button>
        <button type="button" onclick="cerrarLote()">Finalizar Carga</button>
    </form>
    <h3>Productos Guardados en la Sesión:</h3>
    <ul id="listaProductos"></ul>
    <p id="estadoInventario"></p>
    <script>
        let inventario = [];
        const CAPACIDAD_MAXIMA = 5;
        function agregarProducto()
        {
            let nombre = document.getElementById("productoInput").value;
            if (nombre.trim() === "")
            {
                alert("Ingrese un nombre válido de producto.");
                return;
            }
            let espacioDisponible = true;
            let i = 0;
            while (i < inventario.length)
            {
                if (inventario.length >= CAPACIDAD_MAXIMA)
                {
                    espacioDisponible = false;
                }
                i++;
            }
            if (espacioDisponible && inventario.length < CAPACIDAD_MAXIMA)
            {
                inventario.push(nombre);
                document.getElementById("productoInput").value = "";
                mostrarLista();
            }
            else
            {
                document.getElementById("estadoInventario").innerText = "Límite de capacidad alcanzado (Máximo 5 productos por lote).";
            }
        }
        function mostrarLista() {
            let listaHTML = document.getElementById("listaProductos");
            listaHTML.innerHTML = "";
            let index = 0;
            while (index < inventario.length)
            {
                let item = document.createElement("li");
                item.innerText = "Producto N° " + (index + 1) + ": " + inventario[index];
                listaHTML.appendChild(item);
                index++;
            }
        }
        function cerrarLote() {
            document.getElementById("estadoInventario").innerText = "Lote cerrado con " + inventario.length + " productos registrados.";
        }
    </script>
</body>
</html>
